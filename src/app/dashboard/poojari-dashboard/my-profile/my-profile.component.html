<div class="container-fluid py-4 px-4">
  <!-- Header / Title -->
  <div class="d-flex justify-content-between align-items-center mb-4">
    <div>
      <h2 class="fw-bold text-dark mb-1">My Profile</h2>
      <p class="text-muted small mb-0">Manage your personal details and professional credentials</p>
    </div>
    <button 
      class="btn btn-outline-warning text-dark border-warning px-4"
      (click)="isEditing = !isEditing">
      <i class="bi" [ngClass]="isEditing ? 'bi-x-lg' : 'bi-pencil-square'"></i> 
      {{ isEditing ? 'Cancel' : 'Edit Profile' }}
    </button>
  </div>

  <div class="row g-4">
    <!-- Left Column: Avatar & Badge Card -->
    <div class="col-lg-4">
      <div class="card border-0 shadow-sm text-center p-4">
        <div class="position-relative d-inline-block mx-auto mb-3">
          <div class="rounded-circle bg-warning text-white d-flex align-items-center justify-content-center fw-bold display-5 shadow-sm mx-auto" 
               style="width: 100px; height: 100px; background: linear-gradient(135deg, #f58220, #e06d12) !important;">
            RS
          </div>
          <span class="position-absolute bottom-0 end-0 bg-success border border-white rounded-circle p-2" title="Verified"></span>
        </div>
        
        <h4 class="fw-bold mb-1">{{ profile.fullName }}</h4>
        <p class="text-warning fw-semibold small mb-2"><i class="bi bi-patch-check-fill"></i> Verified Poojari</p>
        <p class="text-muted small mb-3">{{ profile.location }}</p>

        <div class="d-grid gap-2 border-top pt-3 text-start">
          <div class="d-flex justify-content-between small text-muted py-1">
            <span>Experience:</span>
            <span class="fw-bold text-dark">{{ profile.experience }}</span>
          </div>
          <div class="d-flex justify-content-between small text-muted py-1">
            <span>Account Status:</span>
            <span class="badge bg-success bg-opacity-10 text-success">Active</span>
          </div>
        </div>
      </div>
    </div>

    <!-- Right Column: Editable Details Form -->
    <div class="col-lg-8">
      <div class="card border-0 shadow-sm p-4">
        <h5 class="fw-bold mb-4 text-dark border-bottom pb-2">Personal & Professional Information</h5>

        <form (ngSubmit)="saveProfile()">
          <div class="row g-3">
            <div class="col-md-6">
              <label class="form-label small text-muted fw-bold">Full Name</label>
              <input type="text" class="form-control" [(ngModel)]="profile.fullName" name="fullName" [disabled]="!isEditing">
            </div>

            <div class="col-md-6">
              <label class="form-label small text-muted fw-bold">Email Address</label>
              <input type="email" class="form-control" [(ngModel)]="profile.email" name="email" [disabled]="!isEditing">
            </div>

            <div class="col-md-6">
              <label class="form-label small text-muted fw-bold">Phone Number</label>
              <input type="text" class="form-control" [(ngModel)]="profile.phone" name="phone" [disabled]="!isEditing">
            </div>

            <div class="col-md-6">
              <label class="form-label small text-muted fw-bold">Location</label>
              <input type="text" class="form-control" [(ngModel)]="profile.location" name="location" [disabled]="!isEditing">
            </div>

            <div class="col-12">
              <label class="form-label small text-muted fw-bold">Specializations</label>
              <input type="text" class="form-control" [(ngModel)]="profile.specialization" name="specialization" [disabled]="!isEditing">
            </div>

            <div class="col-12">
              <label class="form-label small text-muted fw-bold">Languages Known</label>
              <input type="text" class="form-control" [(ngModel)]="profile.languages" name="languages" [disabled]="!isEditing">
            </div>

            <div class="col-12">
              <label class="form-label small text-muted fw-bold">About / Bio</label>
              <textarea class="form-control" rows="3" [(ngModel)]="profile.bio" name="bio" [disabled]="!isEditing"></textarea>
            </div>

            <div class="col-12 text-end mt-4" *ngIf="isEditing">
              <button type="submit" class="btn btn-warning text-dark px-4 fw-semibold shadow-sm">
                Save Changes
              </button>
            </div>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
