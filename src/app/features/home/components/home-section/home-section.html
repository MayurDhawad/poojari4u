<section class="hero-section">

  <!-- =========================================
       BACKGROUND CAROUSEL
  ========================================== -->
  <div
    id="heroCarousel"
    class="carousel slide carousel-fade hero-carousel"
    data-bs-ride="carousel"
    data-bs-interval="5000"
  >

    <!-- Indicators -->
    <div class="carousel-indicators">
      <button
        type="button"
        data-bs-target="#heroCarousel"
        data-bs-slide-to="0"
        class="active"
        aria-current="true"
        aria-label="Slide 1">
      </button>

      <button
        type="button"
        data-bs-target="#heroCarousel"
        data-bs-slide-to="1"
        aria-label="Slide 2">
      </button>

      <button
        type="button"
        data-bs-target="#heroCarousel"
        data-bs-slide-to="2"
        aria-label="Slide 3">
      </button>
    </div>


    <!-- Slides -->
    <div class="carousel-inner">

      <!-- Slide 1 -->
      <div class="carousel-item active">
        <img
          src="images/slide1.png"
          class="d-block w-100"
          alt="Puja Services"
        />
      </div>

      <!-- Slide 2 -->
      <div class="carousel-item">
        <img
          src="images/slide2.png"
          class="d-block w-100"
          alt="Traditional Services"
        />
      </div>

      <!-- Slide 3 -->
      <!-- <div class="carousel-item">
        <img
          src="images/slide3.png"
          class="d-block w-100"
          alt="Temple Services"
        />
      </div> -->

      <!-- Slide 4 -->
      <!-- <div class="carousel-item">
        <img
          src="images/slide4.png"
          class="d-block w-100"
          alt="Temple Services"
        />
      </div> -->

    </div>


    <!-- Previous -->
    <button
      class="carousel-control-prev"
      type="button"
      data-bs-target="#heroCarousel"
      data-bs-slide="prev"
    >
      <span
        class="carousel-control-prev-icon"
        aria-hidden="true">
      </span>

      <span class="visually-hidden">
        Previous
      </span>
    </button>


    <!-- Next -->
    <button
      class="carousel-control-next"
      type="button"
      data-bs-target="#heroCarousel"
      data-bs-slide="next"
    >
      <span
        class="carousel-control-next-icon"
        aria-hidden="true">
      </span>

      <span class="visually-hidden">
        Next
      </span>
    </button>

  </div>


  <!-- =========================================
       DARK/WHITE OVERLAY
  ========================================== -->
  <div class="hero-gradient"></div>


  <!-- =========================================
       HERO CONTENT
  ========================================== -->
  <div class="hero-content-wrapper">

    <div class="container-fluid px-3 px-lg-5">

      <div class="hero-copy">

        <div class="hero-eyebrow">
          TRADITIONAL SERVICES FOR YOUR SPECIAL MOMENTS
        </div>

        <h2>
          Book Verified Poojaris,<br>
          Bajanthri &amp; Pooja Samagri<br>
          All in One Place
        </h2>

        <p>
          From daily poojas to grand celebrations, Poojari4U
          brings tradition, trust and convenience together.
        </p>

      </div>

    </div>

  </div>

  <!-- =========================================
       SEARCH BOX
  ========================================== -->
  <div class="hero-search-wrapper">
    <div class="container-fluid px-3 px-lg-5">
      <div class="hero-search">

        <!-- Language -->
        <div class="search-field">
          <div class="search-icon">
            <i class="bi bi-translate"></i>
          </div>

          <div class="search-field-content">
            <!-- <label for="service-select">Select Service</label> -->
            <select  id="service-select" class="form-select">
              <!-- <option value="" disabled selected>Select Service</option> -->
               @for (language of languages; track language.value) {
                <option [value]="language.value">
                  {{ language.label }}
                </option>
              }
            </select>
          </div>
        </div>

        <!-- Service -->
        <div class="search-field">
          <div class="search-icon">
            <i class="bi bi-fire"></i>
          </div>

          <div class="search-field-content">
            <!-- <label for="service-select">Select Service</label> -->
            <select  id="service-select" class="form-select">
              <!-- <option value="" disabled selected>Select Service</option> -->
               @for (ceremony of ceremonies; track ceremony.value) {
                <option [value]="ceremony.value">
                  {{ ceremony.label }}
                </option>
              }
            </select>
          </div>
        </div>

        <!-- Location -->
        <div class="search-field">
          <div class="search-icon">
            <i class="bi bi-geo-alt"></i>
          </div>

         <div class="search-field-content">
            <!-- <label for="location-select">Select Location</label> -->
            <select  id="location-select" class="form-select">
              <!-- <option value="" disabled selected>Select Location</option> -->
              @for (group of locationGroups; track group.groupName) {
                <optgroup [label]="group.groupName">
                  @for (item of group.locations; track item) {
                    <option [value]="item">
                      {{ item }}
                    </option>
                  }
                </optgroup>
              }
            </select>
          </div>
        </div>

        <!-- Date -->
        <div class="search-field">
          <div class="search-icon">
            <i class="bi bi-calendar3"></i>
          </div>

          <div class="search-field-content">
            <!-- <label for="date-input">Date</label> -->
            <input type="date" class="form-control" id="date-input">
          </div>
        </div>

        <!-- Search -->
        <button type="button" class="search-button" (click)="search()">
          <!-- <i class="bi bi-search me-2"></i> -->
          <span>Search</span>
        </button>

      </div>

    </div>

  </div>

</section>
