<header class="site-header border-bottom">
  <nav class="navbar navbar-expand-lg">
    <div class="container-fluid px-3 px-lg-5">

      <!-- Logo -->
      <a routerLink="/" class="navbar-brand brand d-flex align-items-center">

        <div class="brand-logo me-2">
          <img
            src="images/logo.png"
            alt="4U Logo"
            width="40"
            height="40"
          />
        </div>

        <div class="brand-content">
          <div class="brand-name">
            Poojari4U<sup>™</sup>
          </div>

          <div class="brand-tagline">
            Your Poojari. Your Puja. Your Way.
          </div>
        </div>

      </a>

      <!-- Mobile toggle -->
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNavbar"
        aria-controls="mainNavbar" aria-expanded="false" aria-label="Toggle navigation">
        <span class="navbar-toggler-icon"></span>
      </button>

      <!-- Navigation -->
      <div class="collapse navbar-collapse" id="mainNavbar">

        <ul class="navbar-nav mx-auto mb-2 mb-lg-0">

          @for (item of navItems; track item.path) {
          <li class="nav-item">
            <a class="nav-link" [routerLink]="item.path" routerLinkActive="active" [routerLinkActiveOptions]="{
                  exact: item.path === '/'
                }">
              {{ item.label }}
            </a>
          </li>
          }

        </ul>

        <!-- Actions -->
        <div class="header-actions d-flex align-items-center gap-2">

          <button mat-icon-button type="button" class="search-button" aria-label="Search">
            <mat-icon>search</mat-icon>
          </button>

          <button mat-stroked-button type="button" class="account-button">
            <mat-icon>person_outline</mat-icon>
            <span>Account</span>
            <mat-icon>expand_more</mat-icon>
          </button>

        </div>

      </div>

    </div>
  </nav>
</header>
