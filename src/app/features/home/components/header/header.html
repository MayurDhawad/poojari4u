<header class="site-header">
  <nav class="navbar navbar-expand-lg">
    <div class="container-fluid header-container">

      <!-- Logo -->
      <a
        routerLink="/"
        class="navbar-brand brand d-flex align-items-center"
        (click)="closeMobileMenu()"
      >
        <img
          src="header/logo.png"
          alt="Poojari4U Logo"
          class="brand-logo"
        />

        <div class="brand-content">
          <img
            src="header/logo-text.png"
            alt="Poojari4U"
            class="brand-name"
          />

          <span class="brand-tagline">
            Your Spiritual Partner.
          </span>
        </div>
      </a>

      <!-- Mobile cart and menu toggle -->
      <div class="mobile-header-actions d-lg-none">

        <button type="button" class="mobile-cart-btn" aria-label="View cart" (click)="onCartClick()">
          <i class="bi bi-cart3"></i>
          @if (cartCount > 0) {
            <span class="cart-count">{{ cartCount }}</span>
          }
        </button>

        <button type="button" class="mobile-menu-btn"
          [attr.aria-expanded]="mobileMenuOpen()" aria-controls="mainNavbar"
          [attr.aria-label]="mobileMenuOpen() ? 'Close menu' : 'Open menu'"
          (click)="toggleMobileMenu()"
        >
          @if (mobileMenuOpen()) {
            <i class="bi bi-x-lg"></i>
          } @else {
            <span></span>
            <span></span>
            <span></span>
          }
        </button>
      </div>

      <!-- Navigation -->
      <div id="mainNavbar" class="navbar-collapse" [class.show]="mobileMenuOpen()">
        <ul class="navbar-nav main-nav">
          @for (item of navItems; track item.path) {
            <li class="nav-item nav-item-link">
              <a class="nav-link" 
                [routerLink]="item.path 
                "routerLinkActive="active" 
                [routerLinkActiveOptions]="{ exact: item.path === '/'}" 
                (click)="closeMobileMenu()">
                {{ item.label }}
                <i class="bi bi-chevron-right mobile-chevron"></i>
              </a>
            </li>
            @if (item.label === 'Poojaris') {
              <li class="nav-item vinayaka-item">
                <img src="header/vinayaka.png" alt="Lord Vinayaka" class="vinayaka-img"/>

                <div class="audio-player-container">
                  <audio #bgAudio loop>
                    <source src="../../../../../assets/audios/Om-Namo-Venkatesaya.mp3" type="audio/mpeg">
                  </audio>

                  <button class="btn btn-sm btn-outline-warning rounded-circle p-2 d-flex align-items-center justify-content-center" (click)="toggleAudio()" [attr.aria-label]="isPlaying ? 'Pause music' : 'Play music'">
                    @if (!isPlaying) {
                      <!-- Play Icon -->
                      <i class="bi bi-play-fill"></i>
                    } @else {
                      <!-- Pause Icon -->
                      <i class="bi bi-pause-fill"></i>
                    }
                  </button>
                </div>
              </li>
            }
          }
        </ul>

                <!-- Desktop actions -->
        <div class="header-actions d-none d-lg-flex align-items-center">
          <button type="button" class="book-poojari-btn" (click)="onRegistration()" [disabled]="disableLoginRegister">
            <i class="bi bi-person-circle me-2"></i>
            <span>Login/Register</span>
          </button>

          <button type="button" class="desktop-cart-btn" aria-label="View cart" (click)="onCartClick()">
            <i class="bi bi-cart3"></i>
            @if (cartCount > 0) {
              <span class="cart-count">{{ cartCount }}</span>
            }
          </button>
        </div>
        
        
        <!-- Mobile menu footer -->
        <div class="mobile-menu-footer d-lg-none">

          <button type="button" class="login-btn mt-3" (click)="onRegistration()">
            <i class="bi bi-person"></i>
            <span>Login / Register</span>
          </button>
        
          <div class="menu-divider">
            <span></span>
            <!-- <i class="bi bi-om bg-dark"></i> -->
            <img src="header/vinayaka.png" alt="Lord Vinayaka" class="vinayaka-img" />
            <span></span>
          </div>

          <p class="menu-tagline">
            Your Spiritual Partner.
          </p>
        </div>


      </div>
    </div>
  </nav>
</header>

<!-- Mobile backdrop -->
@if (mobileMenuOpen()) {
  <button
    type="button"
    class="mobile-backdrop d-lg-none"
    aria-label="Close navigation menu"
    (click)="closeMobileMenu()"
  ></button>
}
