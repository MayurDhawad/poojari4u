<header class="border-bottom">
  <nav class="navbar navbar-expand-lg">
    <div class="container-fluid px-3">
      <!-- Logo -->
      <a routerLink="/" class="navbar-brand brand d-flex align-items-center">
        <div class="brand-logo me-lg-2">
          <img src="header/logo.png" alt="4U Logo"/>
        </div>

        <div class="brand-content">
          <div class="brand-name">
             <img src="header/logo-text.png" alt="4U Logo"/>
          </div>

          <div class="brand-tagline">
            Your Spiritual Partner.
          </div>
        </div>
      </a>

      <!-- Mobile toggle -->
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNavbar"
        aria-controls="mainNavbar" aria-expanded="false" aria-label="Toggle navigation">
        <span class="navbar-toggler-icon"></span>
      </button>

      <!-- Navigation -->
      <div class="collapse navbar-collapse" id="mainNavbar">

        <ul class="navbar-nav mx-auto mb-2 mb-lg-0">
          @for (item of navItems; track item.path) {
            <li class="nav-item nav-item-link">
              <a class="nav-link" [routerLink]="item.path" routerLinkActive="active"[routerLinkActiveOptions]="{exact: item.path === '/'}">
                {{ item.label }}
              </a>
            </li>

            @if (item.label === 'Bajanthri') {
              <li class="nav-item vinayaka-item">
                <img
                  src="header/vinayaka.png"
                  alt="Lord Vinayaka"
                  class="vinayaka-img"
                />
              </li>
            }

          }

        </ul>

        <!-- Actions -->
        <div class="header-actions d-flex align-items-center gap-2">

          <button class="book-poojari-btn" type="button" (click)="onRegistration()">
            <span>Register as a Poojari</span>  
          </button>

          <i class="bi bi-cart fs-5 ms-3"></i>

        </div>

      </div>

    </div>
  </nav>
</header>
