<section class="py-5" style="background-color: #fff3e5;">
  <div class="container-fluid px-lg-5 text-center py-4">
    
    <!-- Title and Subtitle -->
    <h2 class="display-6 fw-bold mb-3">
      Why Poojari4U?
    </h2>
    <p class="text-secondary mb-5 fs-6">
      Making traditional ceremonies easier to arrange.
    </p>

    <!-- Features Cards Grid -->
    <div class="row g-4 justify-content-center">
      @for (feature of features(); track feature.id) {
        <div class="col-12 col-sm-6 col-lg-3">
          <div class="card h-100 border-1 rounded-4 shadow-sm p-3 border-light-subtle">
            <div class="card-body d-flex flex-column align-items-center justify-content-center">
              
              <!-- Icon/Symbol Header -->
              <div class="fs-2 mb-2 text-dark d-flex align-items-center justify-content-center icon-container">
                {{ feature.icon }}
              </div>
              
              <!-- Feature Title -->
              <h5 class="card-title fw-bold title text-dark mb-2">
                {{ feature.title }}
              </h5>
              
              <!-- Feature Description -->
              <p class="card-text text-muted description mb-0 px-1">
                {{ feature.description }}
              </p>
              
            </div>
          </div>
        </div>
      }
    </div>

  </div>
</section>
