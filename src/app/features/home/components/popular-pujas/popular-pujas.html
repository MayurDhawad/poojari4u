<section class="py-5" style="background-color: #fdfbf7;">
  <div class="container-fluid px-lg-5 py-3">
    
    <!-- Section Header with View All Link -->
    <div class="d-flex justify-content-between align-items-center mb-4">
      <h2 class="fw-bold mb-0" style="color: #2b1d16; font-family: serif;">
        Popular Services
      </h2>
      <a href="#" class="text-decoration-none fw-semibold" style="color: #e66a0a;">
        View All &rarr;
      </a>
    </div>

    <!-- Cards Grid -->
    <div class="row g-4">
      @for (service of services(); track service.id) {
        <div class="col-12 col-sm-6 col-lg-3">
          <div class="card h-100 border-1 rounded-4 shadow-sm overflow-hidden border-light-subtle card-hover">
            
            <!-- Image Area / Top Container -->
            <div class="card-img-container position-relative bg-light">
              @if (service.imageUrl) {
                <img [src]="service.imageUrl" [alt]="service.title" class="card-img-top object-fit-cover">
              } @else {
                <div class="empty-image-placeholder"></div>
              }
            </div>

            <!-- Card Content Body -->
            <div class="card-body p-3 d-flex flex-column justify-content-between">
              <div>
                <h5 class="card-title fw-bold text-dark mb-2">
                  {{ service.title }}
                </h5>
              </div>

              <!-- Arrow Button -->
              <div class="d-flex justify-content-between mt-3">
                <p class="card-text text-muted small mb-0">
                  {{ service.description }}
                </p>
                <a [href]="service.linkUrl" aria-label="Explore service" class="btn btn-arrow rounded-circle d-flex align-items-center justify-content-center text-decoration-none">
                  &rarr;
                </a>
              </div>
            </div>

          </div>
        </div>
      }
    </div>

  </div>
</section>
