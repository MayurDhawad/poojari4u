<div class="login-wrapper d-flex align-items-center justify-content-center min-vh-100 p-3">
  <div class="card login-card border-0 shadow-sm p-4 p-md-5 position-relative">
    
    <!-- STEP 1: ROLE SELECTION -->
    <ng-container *ngIf="currentStep === 1">

      <button 
        type="button" 
        class="btn-back border-0 bg-transparent p-0 position-absolute text-purple text-decoration-none fw-medium"
        (click)="goBackToHome()">
        &larr; Home
      </button>

      <!-- Header -->
      <div class="text-center mb-4">
        <h2 class="brand-title fw-bold mb-1">
          Poojari<span class="text-orange">4U</span>
        </h2>
        <h4 class="section-title fw-semibold text-purple mb-1">Team Login</h4>
        <p class="text-muted fs-7 mb-0">Select your role to continue</p>
      </div>

      <!-- Role Options list -->
      <div class="role-options d-flex flex-column gap-3 mb-4">
        <div 
          *ngFor="let role of roles" 
          class="role-option-card d-flex align-items-center p-3 rounded-4 cursor-pointer"
          [class.selected]="selectedRole === role.id"
          (click)="selectRole(role.id)">
          
          <input 
            type="radio" 
            name="userRole" 
            [checked]="selectedRole === role.id"
            class="form-check-input custom-radio me-3 mt-0">

          <span class="role-icon me-2 fs-5" aria-hidden="true">{{ role.icon }}</span>
          <span class="role-label fw-medium text-dark">{{ role.number }}. {{ role.label }}</span>
        </div>
      </div>

      <!-- Continue Button -->
      <button 
        type="button" 
        class="btn btn-purple w-100 py-2.5 rounded-3 fw-semibold text-white"
        (click)="goToLogin()">
        Continue
      </button>
    </ng-container>

    <!-- STEP 2: LOGIN FORM -->
    <ng-container *ngIf="currentStep === 2">
      <!-- Back Link -->
      <button 
        type="button" 
        class="btn-back border-0 bg-transparent p-0 position-absolute text-purple text-decoration-none fw-medium"
        (click)="goBackToRoleSelection()">
        &larr; Back
      </button>

      <!-- Header -->
      <div class="text-center mt-3 mb-4">
        <h2 class="brand-title fw-bold mb-3">
          Poojari<span class="text-orange">4U</span>
        </h2>
        <h3 class="card-title fw-bold text-purple mb-1">{{ selectedRoleLabel }} Login</h3>
        <p class="text-secondary fs-7 mb-0">Login to your Poojari4U {{ selectedRoleLabel }} account</p>
      </div>

      <!-- Form -->
      <form [formGroup]="loginForm" (ngSubmit)="onLoginSubmit()">
        <!-- Identifier Input -->
        <div class="mb-3">
          <label for="identifier" class="form-label text-dark fw-semibold fs-7 mb-2">
            Mobile Number / Email
          </label>
          <input 
            type="text" 
            id="identifier"
            formControlName="identifier"
            class="form-control custom-input py-2 px-3" 
            placeholder="Enter mobile number or email"
            [class.is-invalid]="loginForm.get('identifier')?.touched && loginForm.get('identifier')?.invalid">
        </div>

        <!-- Password Input -->
        <div class="mb-4">
          <label for="password" class="form-label text-dark fw-semibold fs-7 mb-2">
            Password
          </label>
          <input 
            type="password" 
            id="password"
            formControlName="password"
            class="form-control custom-input py-2 px-3" 
            placeholder="Enter password"
            [class.is-invalid]="loginForm.get('password')?.touched && loginForm.get('password')?.invalid">
        </div>

        <!-- Submit Button -->
        <button 
          type="submit" 
          class="btn btn-purple w-100 py-2.5 rounded-3 fw-semibold text-white mb-4">
          Login
        </button>
      </form>

      <!-- Registration Footer Link -->
      <div class="text-center text-muted fs-7">
        Are you a new {{ selectedRoleLabel }}? 
        <a role="button" class="text-purple fw-bold text-decoration-none ms-1 cursor-pointer" (click)="onRegisterClick()">
          Click here to Register
        </a>
      </div>
    </ng-container>

  </div>
</div>
