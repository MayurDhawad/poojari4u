name: Protect Main Branch

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review

permissions:
  contents: read
  pull-requests: read

jobs:
  validate-main-source:
    name: Require master as source for main
    runs-on: ubuntu-latest

    steps:
      - name: Validate source and target branches
        shell: bash
        run: |
          SOURCE_BRANCH="${{ github.head_ref }}"
          TARGET_BRANCH="${{ github.base_ref }}"

          echo "Source branch: ${SOURCE_BRANCH}"
          echo "Target branch: ${TARGET_BRANCH}"

          if [[ "${TARGET_BRANCH}" != "main" ]]; then
            echo "❌ This workflow only validates pull requests targeting main."
            exit 1
          fi

          if [[ "${SOURCE_BRANCH}" != "master" ]]; then
            echo "❌ Only master can merge into main."
            echo "Allowed flow: master => main"
            exit 1
          fi

          echo "✅ Valid pull request: master => main"